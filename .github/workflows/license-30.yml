name: "2. Активация на 30 дней"
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "ID устройств — до 20 штук через пробел или запятую (например ABCDE-23456 FGHJK-78923). Если ID уже активен — срок продлится на 30 дней."
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  run:
    uses: ./.github/workflows/_license.yml
    with:
      cmd: grant
      days: "30"
      ids: ${{ inputs.ids }}
    secrets: inherit
